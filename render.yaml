# Render Blueprint for the HisabKhata API (Dashboard > New > Blueprint > pick this repo).
# Free setup: no Redis (jobs run inline), local file storage (ephemeral), no outgoing email.
# Add Upstash, Cloudinary and SMTP later; see docs/deployment.md.
services:
  - type: web
    name: hisabkhata-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npx -y pnpm@10.28.0 install --frozen-lockfile --prod=false && npx -y pnpm@10.28.0 --filter @hisabkhata/api build
    # Migrations and the idempotent reference-data seed (permissions, plans) run on every start.
    startCommand: cd apps/api && npx prisma migrate deploy && npx ts-node --transpile-only prisma/seed.ts && node dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # Neon pooled connection string (host contains -pooler)
      - key: DIRECT_DATABASE_URL
        sync: false            # Neon direct connection string (no -pooler), used by migrations
      - key: APP_URL
        value: https://hisabkhata-omega.vercel.app
      - key: API_URL
        value: https://hisabkhata-api-2r1d.onrender.com
      - key: CORS_ORIGINS
        value: https://hisabkhata-omega.vercel.app,https://hisabkhata-mtbc.vercel.app
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: COOKIE_SAMESITE
        value: lax
      - key: QUEUES_ENABLED
        value: "false"
      - key: STORAGE_DRIVER
        value: local
      - key: SEED_DEMO_DATA
        value: "false"
