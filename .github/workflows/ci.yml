name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: 'API: lint, typecheck, tests'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hisabkhata_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hisabkhata_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hisabkhata_test?schema=public
      JWT_ACCESS_SECRET: ci-secret-that-is-at-least-thirty-two-chars
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hisabkhata/api lint
      - run: pnpm --filter @hisabkhata/api typecheck
      - run: pnpm --filter @hisabkhata/api test
      - run: pnpm --filter @hisabkhata/api build

  web:
    name: 'Web: lint, typecheck, build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hisabkhata/web lint
      - run: pnpm --filter @hisabkhata/web typecheck
      - run: pnpm --filter @hisabkhata/web build
