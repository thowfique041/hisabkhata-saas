<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HisabKhata">
  <title>HisabKhata</title>
  <!-- Tile: deep navy -->
  <rect width="64" height="64" rx="14" fill="#0F1E3D"/>
  <!-- Ledger rule lines (soft blue) -->
  <rect x="14" y="47" width="36" height="2.5" rx="1.25" fill="#7FA7E6" opacity="0.55"/>
  <!-- Left column: shorter (opening balance) -->
  <rect x="16" y="22" width="8" height="22" rx="2" fill="#FFFFFF"/>
  <!-- Right column: taller (growth) -->
  <rect x="40" y="13" width="8" height="31" rx="2" fill="#FFFFFF"/>
  <!-- Rising crossbar forms the H and the growth line (emerald) -->
  <path d="M22.5 35.5 L41.5 26.5 L41.5 33.2 L22.5 42.2 Z" fill="#10B981"/>
</svg>
